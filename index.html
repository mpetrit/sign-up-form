<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="logo-section">
            <div class="logo">
                <img src="/assets/images/odin-logo.png" alt="Odin logo" >
                <h1 class="logo-title">ODIN</h1>
            </div>
    
            <p>Photo by <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA" target="_blank">Halie West</a> on 
    <a href="https://unsplash.com" target="_blank">Unsplash</a>
            </p>
        </div>
    
    
    
        <div class="form-section">
            <p class="form-text">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.        </p>
            <p class="form-text">You <i>know</i> you want to.</p>
            <form method="post" >
                <h2>Let's do this!</h2>
                <div class="input-container">
                    <div class="input-card">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    
                    <div class="input-card">
                            <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                    <div class="input-card">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="input-card">
                        <label for="phone-number">Phone number</label>
                        <input type="tel" id="phone-number" name="phone-number">
                    </div>
                    <div class="input-card">
                        <label for="password">Password</label>
                        <input minlength="8" type="password" id="password" name="password">
                    </div>
                    <div class="input-card">
                        <label for="confirm-password">Confirm Password</label>
                        <input minlength="8" type="password" id="confirm-password" name="confirm-password">
                    </div>
    
                </div>
    
            </form>
            <button type="submit">Create Account</button>
            <p class=" form-text login-text">Already have an account? <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0" target="_blank" class="login-link">Log in</a></p>
    
        </div>
    </div>
</body>
</html>
